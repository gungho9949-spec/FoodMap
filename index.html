<!-- 카카오맵 도메인: https://foodmap-kr.vercel.app -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodMap - 유튜버 추천 맛집 지도</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=28bac2696bc8d416ce3d2f349581838e&libraries=clusterer"></script>
<script src="data/curated-food.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow: hidden; scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #f4f6f8; color: #1a1a1a;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* 헤더 */
header {
  height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb;
  display: flex; align-items: center; padding: 0 16px; gap: 10px;
  flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  position: sticky; top: 0; z-index: 100;
}
.logo-wrap { cursor: pointer; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.logo-wrap:hover .logo-text { color: #22c55e; }
.logo-icon { font-size: 22px; }
.logo-text { font-size: 17px; font-weight: 700; color: #1a1a1a; transition: color .2s; }
.logo-sub { font-size: 10px; color: #9ca3af; }
.count-badge {
  background: #f0fdf4; color: #16a34a;
  border: 1px solid #bbf7d0; border-radius: 99px;
  padding: 3px 10px; font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.search-wrap { margin-left: auto; position: relative; flex-shrink: 0; }
.search-input-row {
  display: flex; align-items: center;
  background: #f4f6f8; border: 1.5px solid #e5e7eb;
  border-radius: 10px; padding: 0 10px; gap: 6px; transition: border-color .2s;
}
.search-input-row:focus-within { border-color: #22c55e; background: #fff; }
.search-icon { font-size: 13px; color: #9ca3af; flex-shrink: 0; }
.search-input {
  border: none; background: transparent; outline: none;
  font-size: 14px; font-family: inherit; color: #1a1a1a;
  width: 180px; height: 32px;
}
.search-input::placeholder { color: #9ca3af; }
.search-dropdown {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: #fff; border: 1.5px solid #e5e7eb; border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.10); z-index: 9999; overflow: hidden;
}
.search-dropdown.open { display: block; }
.search-item {
  padding: 10px 14px; cursor: pointer;
  border-bottom: 1px solid #f3f4f6; transition: background .15s;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: #f0fdf4; }
.search-item-name { font-size: 13px; font-weight: 700; color: #1a1a1a; }
.search-item-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.search-empty { padding: 14px; text-align: center; font-size: 13px; color: #9ca3af; }

/* ════════════════════════════════════════════════════════════════
   [OLD] 필터 바(드롭다운 셀렉트 6개) — 캐치테이블 스타일 아이콘 그리드로
   교체되어 더 이상 사용하지 않음. 나중에 되돌릴 수도 있어 삭제하지 않고
   주석 처리만 해 둠 (관련 HTML/JS도 동일하게 주석 처리됨).
#filter-bar {
  background: #fff; border-bottom: 1px solid #e5e7eb;
  padding: 8px 16px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.filter-select {
  padding: 7px 26px 7px 10px; border-radius: 8px;
  border: 1.5px solid #e5e7eb; background: #fff; color: #374151;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: border-color .15s; max-width: 170px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7280' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 10px center;
  -webkit-appearance: none; appearance: none;
}
.filter-select:hover { border-color: #86efac; }
.filter-select:focus { outline: none; border-color: #22c55e; }
.result-count-text { font-size: 12px; color: #6b7280; margin-left: auto; white-space: nowrap; }

@media (max-width: 767px) {
  #filter-bar { flex-wrap: wrap; }
  .filter-select { flex: 1 1 auto; min-width: 100px; max-width: none; }
  .result-count-text { display: none; }
}
   ════════════════════════════════════════════════════════════════ */

/* 필터 아이콘 그리드 (캐치테이블 스타일) — 유튜버/지역/음식종류/인증/정렬 5칩 */
#filter-chip-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  padding: 10px 6px; background: #fff; border-bottom: 1px solid #e5e7eb;
  flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.filter-chip-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 6px 2px; border: none; background: none; cursor: pointer;
  font-family: inherit; border-radius: 10px; transition: background .15s;
}
.filter-chip-btn:hover { background: #f4f6f8; }
.filter-chip-icon-wrap {
  width: 42px; height: 42px; border-radius: 50%; background: #f4f6f8;
  display: flex; align-items: center; justify-content: center; font-size: 19px;
  border: 1.5px solid transparent; transition: all .15s;
}
.filter-chip-btn.active .filter-chip-icon-wrap { background: #f0fdf4; border-color: #16a34a; }
.filter-chip-text {
  font-size: 11px; font-weight: 600; color: #6b7280;
  max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.filter-chip-btn.active .filter-chip-text { color: #16a34a; font-weight: 700; }

/* 필터 선택 피커 — 모바일: 바텀시트 / PC(≥768px): 좌측 상단 드롭다운 패널 */
#filter-picker-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 1400;
}
#filter-picker-overlay.open { display: block; }
#filter-picker {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1500;
  background: #fff; border-radius: 20px 20px 0 0; max-height: 70vh;
  flex-direction: column; overflow: hidden; box-shadow: 0 -4px 24px rgba(0,0,0,.12);
}
#filter-picker.open { display: flex; }
.filter-picker-handle { width: 44px; height: 5px; background: #d1d5db; border-radius: 3px; margin: 10px auto 0; flex-shrink: 0; }
.filter-picker-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0;
}
.filter-picker-title { font-size: 15px; font-weight: 700; color: #1a1a1a; }
.filter-picker-close {
  background: #f3f4f6; border: none; border-radius: 50%;
  width: 28px; height: 28px; font-size: 13px; color: #6b7280; cursor: pointer;
}
.filter-picker-body { flex: 1; overflow-y: auto; padding: 6px 0 16px; }
.picker-option {
  padding: 12px 20px; font-size: 14px; color: #374151; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.picker-option:hover { background: #f9fafb; }
.picker-option.selected { color: #16a34a; font-weight: 700; background: #f0fdf4; }
.picker-count { font-size: 12px; color: #9ca3af; font-weight: 500; }

@media (min-width: 768px) {
  #filter-picker {
    bottom: auto; left: 16px; right: auto; top: 100px; width: 300px;
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-height: 60vh;
  }
  .filter-picker-handle { display: none; }
}

/* 필터 결과 리스트 헤더 — 필터 활성화 시에만 노출 */
#filter-result-header {
  padding: 12px 16px 4px; font-size: 13px; font-weight: 700; color: #374151; flex-shrink: 0;
}

/* "이번 주 추천" 히어로 캐러셀 (홈 최상단, 카드 1장이 화면 대부분을 차지하는 스와이프 배너) */
#hero-carousel { background: #fff; flex-shrink: 0; }
.hero-header { padding: 14px 16px 10px; }
.hero-title { font-size: 16px; font-weight: 800; color: #1a1a1a; }
.hero-subtitle { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.hero-scroll {
  display: flex; align-items: stretch; gap: 12px; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; padding: 0 16px 4px; scrollbar-width: none;
}
.hero-scroll::-webkit-scrollbar { display: none; }
/* 캐러셀 카드들의 높이를 항상 맞추기 위한 래퍼 — align-items:stretch로 늘어난
   래퍼 높이를 안쪽 food-card-hero가 100% 채우도록 display:flex로 한 번 더 감쌈 */
.hero-card-wrap {
  display: flex; flex: 0 0 85%; max-width: 420px; scroll-snap-align: center;
}
.food-card.food-card-hero { flex: 1; margin: 0; }
.food-card-hero .card-thumb { font-size: 56px; }
.food-card-hero .card-name { font-size: 17px; }
.food-card-hero .card-info { height: 96px; padding: 12px 14px; }
.hero-indicator { text-align: center; font-size: 12px; color: #6b7280; font-weight: 700; padding: 2px 0 14px; }

/* 큐레이션 테마 섹션 (히어로 캐러셀 아래, 필터 활성화 시 통째로 숨겨짐) — 가로 스크롤 카드 캐러셀 */
#curation-sections { background: #fff; flex-shrink: 0; }
.curation-section { padding: 14px 0 4px; border-bottom: 1px solid #f3f4f6; }
.curation-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 10px; margin-bottom: 10px; padding: 0 16px;
}
.curation-title { font-size: 15px; font-weight: 800; color: #1a1a1a; }
.curation-subtitle { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.curation-more-btn {
  font-size: 12px; font-weight: 700; color: #16a34a; background: none; border: none;
  cursor: pointer; padding: 4px 0; flex-shrink: 0; font-family: inherit;
}
.curation-more-btn:hover { text-decoration: underline; }
.curation-scroll {
  display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; padding: 0 16px 12px;
  scrollbar-width: none;
}
.curation-scroll::-webkit-scrollbar { display: none; }
.food-card.food-card-mini {
  flex: 0 0 160px; width: 160px; height: 224px; margin: 0; scroll-snap-align: start;
}
.food-card-mini .card-name { font-size: 13px; }
.food-card-mini .card-info { padding: 8px 10px 10px; }

/* "가본 곳" 진행률 바 (홈=리스트뷰 상단, 큐레이션 섹션 위) */
#visit-progress { background: #fff; flex-shrink: 0; padding: 12px 16px; border-bottom: 1px solid #f3f4f6; }
.visit-progress-text { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 6px; }
.visit-progress-text strong { color: #16a34a; font-size: 13px; }
.visit-progress-bar { height: 6px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
.visit-progress-fill { height: 100%; background: #16a34a; border-radius: 99px; transition: width .3s ease; }

/* "⭐ 내가 찜한 곳" 홈 진입점 — 찜한 곳 0개면 renderSavedEntry()가 display:none 처리 */
#saved-entry { padding: 0 16px 12px; }
#saved-entry-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: 12px; border: 1.5px solid #fde68a;
  background: #fffbeb; color: #b45309; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: background .15s;
}
#saved-entry-btn:hover { background: #fef3c7; }
.saved-entry-count {
  background: #f59e0b; color: #fff; border-radius: 99px;
  min-width: 20px; height: 20px; padding: 0 6px;
  font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
}

/* ════════════════════════════════════════════════════════════════
   [OLD] 칩(chip) 기반 필터 패널 스타일 — 드롭다운 방식으로 교체되어
   더 이상 사용하지 않음. 나중에 되돌릴 수도 있어 삭제하지 않고
   주석 처리만 해 둠 (관련 HTML/JS도 동일하게 주석 처리됨).
#filter-trigger {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 99px;
  border: 1.5px solid #e5e7eb; background: #fff; color: #374151;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s; flex-shrink: 0;
}
#filter-trigger:hover { border-color: #22c55e; color: #16a34a; }
#filter-trigger.active { background: #f0fdf4; border-color: #22c55e; color: #16a34a; }
.filter-trigger-icon { font-size: 13px; }
.filter-trigger-badge {
  background: #16a34a; color: #fff; border-radius: 99px;
  min-width: 18px; height: 18px; padding: 0 5px;
  font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

#filter-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.32);
  z-index: 1400;
}
#filter-overlay.open { display: block; }

#filter-panel {
  display: none; position: fixed; top: 100px; left: 16px;
  width: 360px; max-height: 70vh;
  background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.18);
  z-index: 1500; flex-direction: column; overflow: hidden;
}
#filter-panel.open { display: flex; }
.filter-panel-handle { display: none; }
.filter-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0;
}
.filter-panel-title { font-size: 15px; font-weight: 700; color: #1a1a1a; }
.filter-panel-close {
  background: #f3f4f6; border: none; border-radius: 50%;
  width: 28px; height: 28px; font-size: 13px; color: #6b7280; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.filter-panel-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }
.filter-section-title { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 8px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-group-sub { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e7eb; }
.filter-chip {
  padding: 6px 13px; border-radius: 99px;
  border: 1.5px solid #e5e7eb; background: #fff; color: #4b5563;
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s; white-space: nowrap;
}
.filter-chip:hover:not(.on) { border-color: #86efac; color: #16a34a; }
.filter-chip.on { background: #16a34a; border-color: #16a34a; color: #fff; }
.filter-chip.major.on { background: #15803d; border-color: #15803d; }
.filter-chip .chip-count { opacity: .65; font-weight: 500; margin-left: 3px; }
.filter-panel-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-top: 1px solid #f3f4f6; flex-shrink: 0;
}
.filter-reset-link {
  font-size: 13px; color: #6b7280; font-weight: 600; cursor: pointer;
  text-decoration: underline; flex-shrink: 0;
}
.filter-reset-link:hover { color: #ef4444; }
.filter-apply-btn {
  flex: 1; padding: 11px; border: none; border-radius: 10px;
  background: #16a34a; color: #fff; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: background .15s;
}
.filter-apply-btn:hover { background: #15803d; }

@media (max-width: 767px) {
  #filter-panel {
    top: auto; bottom: 0; left: 0; right: 0; width: 100%;
    border-radius: 20px 20px 0 0; max-height: 78vh;
  }
  .filter-panel-handle {
    display: block; width: 44px; height: 5px; background: #d1d5db;
    border-radius: 3px; margin: 10px auto 0; flex-shrink: 0;
  }
}
   ════════════════════════════════════════════════════════════════ */

/* 메인 (좌: 리스트/상세, 우: 지도 — PC 1024px 이상은 좌우 분할, 미만은 한 번에 하나씩) */
.main { display: flex; flex: 1; overflow: hidden; }

#left-panel {
  width: 100%; background: #fff;
  display: flex; flex-direction: column; overflow: hidden;
}

/* 리스트(피드) */
#list-view { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; }
#list-view::-webkit-scrollbar { width: 4px; }
#list-view::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

.food-card {
  display: flex; flex-direction: column;
  margin: 10px 12px; border-radius: 12px; overflow: hidden;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.10);
  cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
}
.food-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.14); }

/* 필터 결과 리스트 전용 가로형 컴팩트 카드 — 세로 한 화면에 카드가 1.5~2개 이상 걸쳐 보이도록
   사진 비율(4:3)은 유지하되 썸네일을 작게 고정하고 카드를 가로 배치로 바꿔 전체 높이를 줄임 */
.food-card.food-card-compact { flex-direction: row; align-items: stretch; margin: 6px 12px; height: 80px; }
.food-card-compact .card-thumb { width: 104px; height: 80px; flex: 0 0 104px; border-radius: 12px 0 0 12px; }
.food-card-compact .card-info { justify-content: center; padding: 6px 12px; }
.food-card-compact .card-name { font-size: 14px; }

/* 사진(4:3) — 있으면 실사진, 없으면 카테고리 아이콘으로 대체 */
.card-thumb {
  position: relative; width: 100%; aspect-ratio: 4 / 3; flex-shrink: 0;
  background: #f0fdf4; display: flex; align-items: center; justify-content: center;
  font-size: 40px; overflow: hidden; border-radius: 12px 12px 0 0;
}
.card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* "가봤어요" 체크한 곳은 썸네일 우측 상단에 녹색 체크 배지 */
.card-visited-badge {
  position: absolute; top: 6px; right: 6px; z-index: 2;
  width: 22px; height: 22px; border-radius: 50%;
  background: #16a34a; color: #fff; font-size: 12px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
/* "가고싶어요" 별 토글 — 썸네일 좌측 상단, 카드 클릭과 분리된 버튼 */
.card-save-btn {
  position: absolute; top: 6px; left: 6px; z-index: 2;
  width: 24px; height: 24px; border-radius: 50%; border: none;
  background: rgba(255,255,255,.85); color: #9ca3af;
  font-size: 15px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.2); transition: transform .1s;
}
.card-save-btn:hover { transform: scale(1.12); }
.card-save-btn.on { color: #f59e0b; }
/* 사진 로딩 중 회색 스켈레톤 */
.card-thumb.skeleton {
  background: linear-gradient(90deg, #eceff1 25%, #e2e5e8 37%, #eceff1 63%);
  background-size: 400% 100%; animation: card-skeleton 1.4s ease infinite;
}
@keyframes card-skeleton {
  0% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

.card-info { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 10px 12px 12px; overflow: hidden; }
.card-name {
  font-size: 14px; font-weight: 700; color: #1a1a1a;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

<script>
// 지도 초기화
var container = document.getElementById('map');
var options = { center: new kakao.maps.LatLng(36.2, 127.8), level: 13 };
var map = new kakao.maps.Map(container, options);

// 마커 이미지 (골프노노 동일 패턴)
const mkSvg = (fill, size) =>
  'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${size/2-2}" fill="${fill}" stroke="#fff" stroke-width="2"/></svg>`
  );
const normalImg = new kakao.maps.MarkerImage(mkSvg('#22c55e', 16), new kakao.maps.Size(16,16), { offset: new kakao.maps.Point(8,8) });
const activeImg  = new kakao.maps.MarkerImage(mkSvg('#16a34a', 22), new kakao.maps.Size(22,22), { offset: new kakao.maps.Point(11,11) });

// 여러 유튜버가 추천한 곳은 별 모양 마커로 구분
const mkStarSvg = (fill, size) =>
  'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M12 1.5l3.09 6.26 6.91 1-5 4.87 1.18 6.88L12 17.13l-6.18 3.38L7 13.63l-5-4.87 6.91-1z" fill="${fill}" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>`
  );
const multiImg       = new kakao.maps.MarkerImage(mkStarSvg('#f59e0b', 24), new kakao.maps.Size(24,24), { offset: new kakao.maps.Point(12,12) });
const multiActiveImg = new kakao.maps.MarkerImage(mkStarSvg('#d97706', 30), new kakao.maps.Size(30,30), { offset: new kakao.maps.Point(15,15) });

let activeMarker = null;
let activeFood   = null;

/* ── 지역/카테고리 정규화 ── */
// 일부 주소가 "전남광주통합특별시"로 잘못 붙어 있어(카카오 API 응답 이슈),
// 광주광역시 5개 구는 광주로, 나머지 시/군은 전남으로 재분류한다.
const GWANGJU_GU = ['동구','서구','남구','북구','광산구'];
const REGION_ALIAS = {
  '전북특별자치도': '전북', '강원특별자치도': '강원', '제주특별자치도': '제주',
  // TourAPI 등 일부 출처는 축약형이 아니라 정식 시/도 명칭을 줘서(예: "충청남도") 추가함
  '충청남도': '충남', '충청북도': '충북', '경상북도': '경북', '경상남도': '경남',
  '전라남도': '전남', '전라북도': '전북', '경기도': '경기', '서울특별시': '서울',
  '부산광역시': '부산', '대구광역시': '대구', '인천광역시': '인천', '광주광역시': '광주',
  '대전광역시': '대전', '울산광역시': '울산', '세종특별자치시': '세종',
};
function extractRegion(address) {
  if (!address) return '기타';
  const [first, second] = address.split(' ');
  if (first === '전남광주통합특별시') return GWANGJU_GU.includes(second) ? '광주' : '전남';
  return REGION_ALIAS[first] || first;
}
// 카드에 "서울 강동구"처럼 구/군 단위까지 보여주기 위한 파서.
// 주소는 보통 [시/도] [시/군/구] [읍/면/동/로...] 순서라, 시/도 다음 토큰부터
// 시/군/구로 끝나는 토큰을 찾음 — "수원시 팔달구"처럼 시 다음에 구가 한 번 더
// 나오는 경우가 있어 구가 나오면 그걸 우선하고, 없으면 시/군을 그대로 씀.
function extractDistrict(address) {
  if (!address) return extractRegion(address);
  const province = extractRegion(address);
  const tokens = address.split(' ');
  let siToken = null;
  for (let i = 1; i < tokens.length && i < 4; i++) {
    const t = tokens[i];
    if (/(시|군|구)$/.test(t)) {
      if (t.endsWith('구')) return `${province} ${t}`;
      if (!siToken) siToken = t;
    } else if (siToken) {
      break;
    }
  }
  return siToken ? `${province} ${siToken}` : province;
}

// 필터 상태 (3축: 유튜버/지역/음식종류 — 드롭다운 단일선택, 축 간 AND)
const filterState = {
  youtuber: '',
  region: '',
  categoryMajor: '',
  certification: '', // '백년가게' | '한국관광공사' — certification 문자열에 부분일치로 판단
  visited: '', // '' | 'visited' | 'unvisited'
  saved: '', // '' | 'saved' | 'unsaved'
  sort: '', // '' | 'rating' | 'reviewCount'
};

// 5개 필터 칩(정렬 포함) 중 하나라도 "전체"가 아니면 홈(캐러셀+큐레이션)을 숨기고
// 필터링된 결과 리스트를 보여줌. visited/saved는 칩 UI는 없지만("내가 찜한 곳"
// 진입점처럼 프로그램적으로 켜질 수 있어) 같은 원칙으로 홈↔결과 전환에 포함시킴.
function isAnyFilterActive() {
  return !!(filterState.youtuber || filterState.region || filterState.categoryMajor ||
    filterState.certification || filterState.sort || filterState.visited || filterState.saved);
}

function matchesFilters(food, state) {
  const s = state || filterState;
  if (s.youtuber && !food.youtubers.some(y => y.name === s.youtuber)) return false;
  if (s.region && extractRegion(food.address) !== s.region) return false;
  if (s.categoryMajor && getMajorCategory(food.category) !== s.categoryMajor) return false;
  if (s.certification && !(food.certification && food.certification.includes(s.certification))) return false;
  if (s.visited === 'visited' && !isVisited(food.id)) return false;
  if (s.visited === 'unvisited' && isVisited(food.id)) return false;
  if (s.saved === 'saved' && !isSaved(food.id)) return false;
  if (s.saved === 'unsaved' && isSaved(food.id)) return false;
  return true;
}

/* ── "가봤어요" 방문 기록 저장소 ──
   지금은 localStorage에만 저장. 나중에 로그인 붙이면 이 5개 함수(load/save/isVisited/
   toggleVisited/onVisitedChange) 내부 구현만 서버 API 호출로 바꾸면 되도록 다른 코드는
   이 함수들만 통해서 방문 여부를 읽고 쓰게 함(직접 localStorage나 visitedSet을 만지지 않음). */
const VISIT_STORAGE_KEY = 'visitedRestaurants';
function loadVisitedSet() {
  try {
    const raw = localStorage.getItem(VISIT_STORAGE_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) { return new Set(); }
}
function saveVisitedSet(set) {
  try { localStorage.setItem(VISIT_STORAGE_KEY, JSON.stringify([...set])); } catch (e) {}
}
let visitedSet = loadVisitedSet();
function isVisited(id) { return visitedSet.has(id); }
function toggleVisited(id) {
  if (visitedSet.has(id)) visitedSet.delete(id); else visitedSet.add(id);
  saveVisitedSet(visitedSet);
  onVisitedChange(id);
}
// 방문 상태가 바뀔 때마다 화면에서 갱신이 필요한 곳들을 한 곳에서 처리
// (진행률 바 / 큐레이션 섹션 / 리스트·필터 / 지금 열려 있는 상세 패널의 버튼 상태)
function onVisitedChange(id) {
  renderVisitProgress();
  renderHeroCarousel();
  renderCurationSections();
  applyFilters();
  if (activeFood && activeFood.id === id) {
    document.querySelectorAll(`.visit-toggle-btn[data-id="${id}"]`).forEach(btn => {
      const on = isVisited(id);
      btn.classList.toggle('on', on);
      btn.textContent = on ? '✓ 가봤어요' : '가봤어요';
    });
  }
}
function renderVisitProgress() {
  const total = CURATED_FOOD.length;
  const visited = visitedSet.size;
  const pct = total ? Math.round((visited / total) * 100) : 0;
  document.getElementById('visit-progress').innerHTML = `
    <div class="visit-progress-text">내가 가본 곳 <strong>${visited}</strong>/${total}</div>
    <div class="visit-progress-bar"><div class="visit-progress-fill" style="width:${pct}%"></div></div>`;
}

/* ── "가고싶어요"(찜) 저장소 — visitedRestaurants와 완전히 분리된 키를 씀.
   구조는 방문 기록과 동일(load/save/isSaved/toggleSaved/onSavedChange 5개 함수로만
   읽고 쓰게 함) — 나중에 로그인 붙이면 이 함수들 내부만 서버 API 호출로 바꾸면 됨. */
const SAVE_STORAGE_KEY = 'savedRestaurants';
function loadSavedSet() {
  try {
    const raw = localStorage.getItem(SAVE_STORAGE_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) { return new Set(); }
}
function saveSavedSet(set) {
  try { localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify([...set])); } catch (e) {}
}
let savedSet = loadSavedSet();
function isSaved(id) { return savedSet.has(id); }
function toggleSaved(id) {
  if (savedSet.has(id)) savedSet.delete(id); else savedSet.add(id);
  saveSavedSet(savedSet);
  onSavedChange(id);
}
function onSavedChange(id) {
  renderSavedEntry();
  renderHeroCarousel();
  renderCurationSections();
  applyFilters();
  if (activeFood && activeFood.id === id) {
    document.querySelectorAll(`.save-toggle-btn[data-id="${id}"]`).forEach(btn => {
      const on = isSaved(id);
      btn.classList.toggle('on', on);
      btn.textContent = on ? '★ 가고싶어요' : '☆ 가고싶어요';
    });
  }
}
// 홈 화면 진입점: 찜한 곳이 0개면 굳이 보여줄 필요 없어서 숨김(큐레이션 섹션의
// "아이템 0개면 숨김" 패턴과 동일)
function renderSavedEntry() {
  const n = savedSet.size;
  const el = document.getElementById('saved-entry');
  if (n === 0) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = `<button id="saved-entry-btn">⭐ 내가 찜한 곳 <span class="saved-entry-count">${n}</span></button>`;
}
function goToSavedList() {
  deselect();
  filterState.youtuber = ''; filterState.region = ''; filterState.categoryMajor = '';
  filterState.certification = ''; filterState.visited = ''; filterState.saved = 'saved';
  applyFilters();
  document.getElementById('list-view').scrollTop = 0;
}
document.getElementById('saved-entry').addEventListener('click', e => {
  if (e.target.closest('#saved-entry-btn')) goToSavedList();
});

   [OLD] 칩 기반 다중선택 필터 상태 — 드롭다운 단일선택 방식으로
   교체되어 더 이상 사용하지 않음. 나중에 되돌릴 수도 있어

function matchesFilters_OLD(food, state) {

/* ── 필터 드롭다운 데이터 구성 (유튜버/지역/음식종류 목록 + 개수) ── */
const FILTER_YOUTUBER_OPTS = (() => {
  const counts = {};
  CURATED_FOOD.forEach(f => f.youtubers.forEach(y => { counts[y.name] = (counts[y.name]||0) + 1; }));
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
})();
const FILTER_REGION_OPTS = (() => {
  const counts = {};
  CURATED_FOOD.forEach(f => { const r = extractRegion(f.address); counts[r] = (counts[r]||0) + 1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
})();
const FILTER_CATEGORY_MAJOR_OPTS = (() => {
  const counts = {};
  CURATED_FOOD.forEach(f => { const m = getMajorCategory(f.category); counts[m] = (counts[m]||0) + 1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
})();
// 인증(백년가게/한국관광공사 등록)은 유튜버 추천과 별개 축 — certification 문자열에
// 부분일치로 판단하므로(복수 인증은 " · "로 이어붙어 있음) 짧은 키(백년가게/한국관광공사)로 카운트
// 복수 인증은 certification 문자열에 " · "로 이어붙어 있으므로 그 조각들을
// 그대로 옵션으로 쓴다 — 새 인증 출처가 추가돼도 이 코드를 손댈 필요 없음.
const FILTER_CERTIFICATION_OPTS = (() => {
  const counts = {};
  CURATED_FOOD.forEach(f => {
    if (!f.certification) return;
    f.certification.split(' · ').forEach(part => {
      counts[part] = (counts[part] || 0) + 1;
    });
  });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
})();

// 정렬은 다른 4개 필터와 달리 "옵션 값 = 조건"이 아니라 "옵션 값 = 정렬 기준"이라
// count가 없음 — 그래도 같은 피커 UI를 그대로 재사용하도록 {value, label} 형태로 맞춤.
const SORT_OPTS = [
  { value: 'rating', label: '평점 높은순' },
  { value: 'reviewCount', label: '리뷰 많은순' },
];

// 캐치테이블 스타일 아이콘 그리드 5칩 — key는 filterState의 필드명과 그대로 대응.
// picker가 공통 컴포넌트라 새 필터를 추가할 때도 이 배열에 항목만 추가하면 됨.
const FILTER_CHIPS = [
  { key: 'youtuber', icon: '🎬', label: '유튜버', allLabel: '전체', getOptions: () => FILTER_YOUTUBER_OPTS },
  { key: 'region', icon: '📍', label: '지역', allLabel: '전체', getOptions: () => FILTER_REGION_OPTS },
  { key: 'categoryMajor', icon: '🍜', label: '음식종류', allLabel: '전체', getOptions: () => FILTER_CATEGORY_MAJOR_OPTS },
  { key: 'certification', icon: '🏛️', label: '인증', allLabel: '전체', getOptions: () => FILTER_CERTIFICATION_OPTS },
  { key: 'sort', icon: '↕️', label: '정렬', allLabel: '기본순', getOptions: () => SORT_OPTS },
];

function renderFilterChips() {
  const grid = document.getElementById('filter-chip-grid');
  grid.innerHTML = FILTER_CHIPS.map(chip => {
    const val = filterState[chip.key];
    const active = !!val;
    let displayText = chip.label;
    if (active) {
      const opt = chip.getOptions().find(o => o.value === val);
      displayText = (opt && opt.label) || val;
    }
    return `
      <button class="filter-chip-btn${active ? ' active' : ''}" data-key="${chip.key}">
        <span class="filter-chip-icon-wrap">${chip.icon}</span>
        <span class="filter-chip-text">${esc(displayText)}</span>
      </button>`;
  }).join('');
}

let currentPickerKey = null;
function openFilterPicker(key) {
  const chip = FILTER_CHIPS.find(c => c.key === key);
  if (!chip) return;
  currentPickerKey = key;
  document.getElementById('filter-picker-title').textContent = `${chip.label} 선택`;
  const currentVal = filterState[key];
  const allRow = `<div class="picker-option${!currentVal ? ' selected' : ''}" data-value="">${esc(chip.allLabel)}</div>`;
  const optionRows = chip.getOptions().map(o => `
    <div class="picker-option${currentVal === o.value ? ' selected' : ''}" data-value="${esc(o.value)}">
      <span>${esc(o.label || o.value)}</span>
      ${o.count != null ? `<span class="picker-count">${o.count}</span>` : ''}
    </div>`).join('');
  document.getElementById('filter-picker-body').innerHTML = allRow + optionRows;
  document.getElementById('filter-picker-overlay').classList.add('open');
  document.getElementById('filter-picker').classList.add('open');
}
function closeFilterPicker() {
  document.getElementById('filter-picker-overlay').classList.remove('open');
  document.getElementById('filter-picker').classList.remove('open');
  currentPickerKey = null;
}
document.getElementById('filter-chip-grid').addEventListener('click', e => {
  const btn = e.target.closest('.filter-chip-btn');
  if (!btn) return;
  openFilterPicker(btn.dataset.key);
});
document.getElementById('filter-picker-body').addEventListener('click', e => {
  const opt = e.target.closest('.picker-option');
  if (!opt || !currentPickerKey) return;
  filterState[currentPickerKey] = opt.dataset.value;
  closeFilterPicker();
  applyFilters();
});

function updateCount() {
  const n = CURATED_FOOD.filter(f => matchesFilters(f)).length;
  document.getElementById('cnt').textContent = n + '곳';
}

// 정렬 칩 선택에 따라 필터링된 리스트를 재정렬 (기본은 원본 순서 그대로)
function sortFilteredList(list, sortKey) {
  if (sortKey === 'rating') return list.slice().sort((a, b) => (b.rating || 0) - (a.rating || 0));
  if (sortKey === 'reviewCount') return list.slice().sort((a, b) => (b.reviewCount || 0) - (a.reviewCount || 0));
  return list;
}

// 5개 필터 칩 중 하나라도 활성화되면 홈(진행률바/찜 진입점/히어로 캐러셀/큐레이션)을
// 숨기고 필터링된 결과 리스트만 보여줌. 전부 "전체"로 돌아오면 자동으로 홈으로 복귀.
function updateHomeModeVisibility() {
  const active = isAnyFilterActive();
  document.getElementById('visit-progress').style.display = active ? 'none' : '';
  document.getElementById('saved-entry').style.display = active ? 'none' : (savedSet.size ? '' : 'none');
  document.getElementById('hero-carousel').style.display = active ? 'none' : '';
  document.getElementById('curation-sections').style.display = active ? 'none' : '';
  const header = document.getElementById('filter-result-header');
  if (active) {
    header.style.display = '';
    header.textContent = `필터 결과 ${filteredList.length}곳`;
  } else {
    header.style.display = 'none';
  }
}

/* ════════════════════════════════════════════════════════════════
   [OLD] 칩 기반 다중선택 필터 패널 렌더링 로직 — 드롭다운 방식으로
   교체되어 더 이상 사용하지 않음. 나중에 되돌릴 수도 있어
   삭제하지 않고 주석 처리만 해 둠.
const FILTER_CATEGORY_OPTS_OLD = (() => {
  const majorCounts = {};
  const leavesByMajor = {};
  CURATED_FOOD.forEach(f => {
    const major = getMajorCategory(f.category);
    majorCounts[major] = (majorCounts[major]||0) + 1;
    if (!leavesByMajor[major]) leavesByMajor[major] = {};
    leavesByMajor[major][f.category] = (leavesByMajor[major][f.category]||0) + 1;
  });
  const majors = Object.entries(majorCounts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
  const leaves = {};
  Object.entries(leavesByMajor).forEach(([major, obj]) => {
    leaves[major] = Object.entries(obj).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
  });
  return { majors, leaves };
})();

function renderChipGroup(containerId, options, selectedSet, onToggle, extraClass) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = options.map(opt => `
    <button type="button" class="filter-chip${extraClass ? ' ' + extraClass : ''}${selectedSet.has(opt.value) ? ' on' : ''}" data-value="${esc(opt.value)}">
      ${esc(opt.value)}<span class="chip-count">${opt.count}</span>
    </button>`).join('');
  wrap.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => onToggle(btn.dataset.value, btn));
  });
}

function renderFilterPanel() {
  const s = draftState;
  renderChipGroup('filter-chips-youtuber', FILTER_YOUTUBER_OPTS, s.youtubers, (val, btn) => {
    toggleSetValue(s.youtubers, val);
    btn.classList.toggle('on');
    updateFilterPanelLiveCount();
  });
  renderChipGroup('filter-chips-region', FILTER_REGION_OPTS, s.regions, (val, btn) => {
    toggleSetValue(s.regions, val);
    btn.classList.toggle('on');
    updateFilterPanelLiveCount();
  });
  renderChipGroup('filter-chips-category-major', FILTER_CATEGORY_OPTS_OLD.majors, s.categoryMajors, (val, btn) => {
    toggleSetValue(s.categoryMajors, val);
    btn.classList.toggle('on');
    renderCategoryLeafChips();
    updateFilterPanelLiveCount();
  }, 'major');
  renderCategoryLeafChips();
  updateFilterPanelLiveCount();
}

function renderCategoryLeafChips() {
  const s = draftState;
  // 선택되었거나(펼쳐볼 필요 있는) 대분류의 세부 카테고리만 서브 칩으로 노출
  const majorsToShow = s.categoryMajors.size > 0 ? [...s.categoryMajors] : [];
  const leafOpts = majorsToShow.flatMap(m => FILTER_CATEGORY_OPTS_OLD.leaves[m] || []);
  renderChipGroup('filter-chips-category-leaf', leafOpts, s.categoryLeaves, (val, btn) => {
    toggleSetValue(s.categoryLeaves, val);
    btn.classList.toggle('on');
    updateFilterPanelLiveCount();
  });
  document.getElementById('filter-chips-category-leaf').style.display = leafOpts.length ? 'flex' : 'none';
}

function toggleSetValue(set, val) { set.has(val) ? set.delete(val) : set.add(val); }

function updateFilterPanelLiveCount() {
  const n = CURATED_FOOD.filter(f => matchesFilters_OLD(f, draftState)).length;
  document.getElementById('filter-apply-btn').textContent = `결과 ${n}곳 보기`;
}

function toggleFilterPanel() {
  const panel = document.getElementById('filter-panel');
  panel.classList.contains('open') ? closeFilterPanel() : openFilterPanel();
}

function openFilterPanel() {
  draftState = {
    youtubers: new Set(filterState_OLD.youtubers),
    regions: new Set(filterState_OLD.regions),
    categoryMajors: new Set(filterState_OLD.categoryMajors),
    categoryLeaves: new Set(filterState_OLD.categoryLeaves),
  };
  renderFilterPanel();
  document.getElementById('filter-panel').classList.add('open');
  document.getElementById('filter-overlay').classList.add('open');
}

function closeFilterPanel() {
  document.getElementById('filter-panel').classList.remove('open');
  document.getElementById('filter-overlay').classList.remove('open');
}

function resetFilters() {
  draftState = { youtubers: new Set(), regions: new Set(), categoryMajors: new Set(), categoryLeaves: new Set() };
  renderFilterPanel();
}

function applyFilterPanel() {
  filterState_OLD.youtubers = new Set(draftState.youtubers);
  filterState_OLD.regions = new Set(draftState.regions);
  filterState_OLD.categoryMajors = new Set(draftState.categoryMajors);
  filterState_OLD.categoryLeaves = new Set(draftState.categoryLeaves);
  closeFilterPanel();
  applyFilters();
}

function activeFilterChipCount() {
  return filterState_OLD.youtubers.size + filterState_OLD.regions.size + filterState_OLD.categoryMajors.size + filterState_OLD.categoryLeaves.size;
}
   ════════════════════════════════════════════════════════════════ */

function applyFilters() {
  const visibleMarkers = CURATED_FOOD.filter(f => f.marker && matchesFilters(f)).map(f => f.marker);
  clusterer.clear();
  clusterer.addMarkers(visibleMarkers);
  updateCount();
  renderListInitial();
  renderFilterChips();
  updateHomeModeVisibility();
  if (activeFood && !matchesFilters(activeFood)) deselect();
}

updateCount();
renderFilterChips();

// 리스트 상세 ↔ 목록 전환 시 사용할 상태를 없애고, 목록/상세는 항상 둘 중 하나만 보이도록 함
function deselect() {
  if (activeMarker) { activeMarker.setImage(activeMarker.normalImg); activeMarker = null; }
  activeFood = null;
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'flex';
  closeSheet();
}

function select(food, marker) {
  if (!marker) return;
  if (activeMarker) activeMarker.setImage(activeMarker.normalImg);
  activeMarker = marker;
  marker.setImage(marker.activeImg);
  map.setCenter(new kakao.maps.LatLng(food.lat, food.lng));
  map.setLevel(4);
  activeFood = food;

  const isMobileMapView = window.innerWidth < 1024 && document.getElementById('map-wrap').classList.contains('mobile-visible');

  if (isMobileMapView) {
    // 모바일/태블릿에서 지도 위 마커를 직접 클릭한 경우 → 바텀시트로 빠르게 보여줌
    fillPanel('s', food);
    document.getElementById('sheet').classList.add('open');
    document.getElementById('home-fab').classList.add('visible');
    document.querySelectorAll('.locate-btn').forEach(b => b.style.display = 'none');
  } else {
    // 리스트 카드 클릭(모바일/PC 공통) 또는 PC 분할뷰의 지도 마커 클릭 → 좌측 패널이 상세로 전환
    fillPanel('d', food);
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'flex';
    document.getElementById('detail-view').scrollTop = 0;
  }
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── 지도 ↔ 목록 전환 (모바일/태블릿 전용, PC는 항상 좌우 분할이라 해당 없음) ── */
function showMapView() {
  document.getElementById('map-wrap').classList.add('mobile-visible');
  document.getElementById('map-fab').style.display = 'none';
  // 카카오맵은 컨테이너가 display:none인 상태로 생성되면 크기를 0으로 인식해서
  // 타일이 회색 화면으로 안 그려지는 알려진 문제가 있다. #map은 페이지 로드 시
  // 딱 한 번만 생성되는데, 모바일에서는 그 시점에 .map-wrap이 숨겨져 있으므로
  // 지도를 다시 보여줄 때마다 relayout()으로 컨테이너 크기를 재인식시켜야 한다.
  // display:none → block 전환이 실제로 반영된 뒤 호출되도록 다음 프레임에서 실행.
  requestAnimationFrame(() => {
    const center = map.getCenter();
    map.relayout();
    map.setCenter(center); // relayout 과정에서 중심이 틀어지는 것 방지 (Kakao 권장 패턴)
  });
}
function showListView() {
  document.getElementById('map-wrap').classList.remove('mobile-visible');
  document.getElementById('map-fab').style.display = '';
  closeSheet();
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'flex';
}

/* ── 리스트(피드) 렌더링 — 무한 스크롤, 50개씩 배치 추가 ── */
const LIST_PAGE_SIZE = 50;
let filteredList = [];
let listRenderedCount = 0;

const CATEGORY_ICON = {
  '한식': '🍚', '중식': '🥟', '일식': '🍣', '양식': '🍝',
  '분식': '🍢', '카페·디저트': '☕', '기타': '🍽️',
};

// 채널별 배지 색상(카드 전용) — 요청 예시(성시경=파랑, 쯔양=빨강)를 기준으로
// 나머지 채널도 서로 구별되게 배정. 인증은 별도로 금색 계열(.card-badge-cert) 고정.
const CHANNEL_COLORS = {
  '쯔양': { bg: '#fff1f2', color: '#e11d48', border: '#fecdd3' },
  '성시경의 먹을텐데': { bg: '#eff6ff', color: '#2563eb', border: '#bfdbfe' },
  '승우아빠': { bg: '#fff7ed', color: '#c2410c', border: '#fed7aa' },
  '또간집(풍자)': { bg: '#f0fdf4', color: '#15803d', border: '#bbf7d0' },
  '전지적 참견 시점(이영자)': { bg: '#faf5ff', color: '#9333ea', border: '#e9d5ff' },
  '최자로드': { bg: '#ecfeff', color: '#0e7490', border: '#a5f3fc' },
  '식객 허영만의 백반기행': { bg: '#fefce8', color: '#a16207', border: '#fef08a' },
  '맛있는 녀석들': { bg: '#fdf2f8', color: '#be185d', border: '#fbcfe8' },
};
const CHANNEL_COLOR_DEFAULT = { bg: '#f3f4f6', color: '#4b5563', border: '#e5e7eb' };

function channelBadgeStyle(name) {
  const c = CHANNEL_COLORS[name] || CHANNEL_COLOR_DEFAULT;
  return `background:${c.bg};color:${c.color};border-color:${c.border};`;
}

// ── 카드 컴포넌트 단위로 렌더 함수를 분리해 둠: 지금은 food-card 하나뿐이지만,
// 나중에 다른 타입의 카드(광고 등)를 끼워넣을 때 이 스위치만 확장하면 됨.
function renderListItem(food, indexInFilteredList) {
  // 향후 네이티브 광고 슬롯 삽입 지점 (예: 10번째마다 광고 카드로 교체)
  // if (indexInFilteredList > 0 && (indexInFilteredList + 1) % 10 === 0) {
  //   return renderAdCard(indexInFilteredList);
  // }
  // 필터 결과 리스트는 가로형 컴팩트 카드로 렌더 — 한 화면에 여러 개가 걸쳐 보이도록
  return renderFoodCard(food, 'food-card-compact');
}

function renderFoodCard(food, extraClass) {
  const isMulti = food.youtubers.length > 1;
  let channelBadge = '';
  if (isMulti) {
    channelBadge = `<span class="card-badge card-badge-multi">🌟${food.youtubers.length}명 추천</span>`;
  } else if (food.youtubers.length === 1) {
    const ytName = food.youtubers[0].name;
    channelBadge = `<span class="card-badge" style="${channelBadgeStyle(ytName)}">${esc(ytName)}</span>`;
  }
  const certBadge = food.certification ? `<span class="card-badge card-badge-cert" title="${esc(food.certification)}">🏛️</span>` : '';
  const ratingHtml = food.rating
    ? `<span class="card-rating">⭐${food.rating}${food.reviewCount ? ` (${food.reviewCount.toLocaleString()})` : ''}</span>`
    : '';
  const region = extractDistrict(food.address);
  const icon = CATEGORY_ICON[getMajorCategory(food.category)] || '🍽️';
  // 사진이 있으면 로딩 전엔 스켈레톤을 보여주고, 로드 완료/실패 시 img.onload/onerror로 해제.
  // 사진이 없으면 카테고리 아이콘을 바로 보여줌(스켈레톤 불필요).
  const thumb = food.photoUrl
    ? `<img src="${esc(food.photoUrl)}" alt="${esc(food.name)}" loading="lazy"
         onload="this.parentElement.classList.remove('skeleton')"
         onerror="this.parentElement.classList.remove('skeleton'); this.remove(); this.parentElement.textContent='${icon}';">`
    : icon;
  const thumbClass = food.photoUrl ? 'card-thumb skeleton' : 'card-thumb';
  const visitedBadge = isVisited(food.id) ? `<span class="card-visited-badge">✓</span>` : '';
  const saveBtn = `<button class="card-save-btn${isSaved(food.id) ? ' on' : ''}" data-id="${esc(food.id)}" title="가고싶어요">${isSaved(food.id) ? '★' : '☆'}</button>`;

  return `
    <div class="food-card${extraClass ? ' ' + extraClass : ''}" data-id="${esc(food.id)}">
      <div class="${thumbClass}">${thumb}${visitedBadge}${saveBtn}</div>
      <div class="card-info">
        <div class="card-name">${esc(food.name)}</div>
        <div class="card-meta">
          <span class="card-region">📍 ${esc(region)}</span>
          ${ratingHtml}
        </div>
        <div class="card-badges">${channelBadge}${certBadge}</div>
      </div>
    </div>`;
}

function renderListInitial() {
  filteredList = sortFilteredList(CURATED_FOOD.filter(f => matchesFilters(f)), filterState.sort);
  listRenderedCount = 0;
  document.getElementById('food-list').innerHTML = '';
  document.getElementById('list-status').textContent = '';
  if (filteredList.length === 0) {
    document.getElementById('food-list').innerHTML = '<div class="list-empty">조건에 맞는 맛집이 없어요</div>';
    return;
  }
  renderListNextPage();
}

function renderListNextPage() {
  const next = filteredList.slice(listRenderedCount, listRenderedCount + LIST_PAGE_SIZE);
  if (!next.length) return;
  const html = next.map((food, i) => renderListItem(food, listRenderedCount + i)).join('');
  document.getElementById('food-list').insertAdjacentHTML('beforeend', html);
  listRenderedCount += next.length;
  document.getElementById('list-status').textContent =
    listRenderedCount < filteredList.length ? '' : `전체 ${filteredList.length}곳을 다 봤어요`;
}

document.getElementById('food-list').addEventListener('click', e => {
  const saveBtn = e.target.closest('.card-save-btn');
  if (saveBtn) { toggleSaved(saveBtn.dataset.id); return; }
  const card = e.target.closest('.food-card');
  if (!card) return;
  const food = CURATED_FOOD.find(f => f.id === card.dataset.id);
  if (food && food.marker) select(food, food.marker);
});

document.getElementById('list-view').addEventListener('scroll', function() {
  if (listRenderedCount >= filteredList.length) return;
  if (this.scrollTop + this.clientHeight >= this.scrollHeight - 400) {
    renderListNextPage();
  }
});

renderListInitial();

/* ── 큐레이션 테마 섹션 (홈 상단, 필터 위) ──
   sections = [{id, title, getSubtitle?, getItems, moreFilter?}, ...] 형태의 설정 배열로 관리.
   나중에 섹션을 추가/순서 변경할 땐 이 배열만 손대면 됨. */

// 시드 기반 의사난수 — 같은 seed면 항상 같은 순서로 섞임(주간 고정, 새로고침해도 안 바뀜)
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed) {
  const rand = mulberry32(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// ISO 8601 주차(월요일 기준) — 연도*100+주차를 시드로 써서 "이번 주 추천"이
// 같은 주 안에서는 고정되고 다음 주 월요일에 자연스럽게 바뀌도록 함.
function getISOWeekSeed(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // 월=0 ~ 일=6
  d.setUTCDate(d.getUTCDate() - dayNum + 3); // 그 주의 목요일로 이동(ISO 주차 규칙)
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const weekNum = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return d.getUTCFullYear() * 100 + weekNum;
}
function getWeeklyPicks(n) {
  const withPhoto = CURATED_FOOD.filter(f => f.photoUrl);
  const withoutPhoto = CURATED_FOOD.filter(f => !f.photoUrl);
  const seed = getISOWeekSeed(new Date());
  const ordered = seededShuffle(withPhoto, seed).concat(seededShuffle(withoutPhoto, seed + 1));
  return ordered.slice(0, n);
}
function byRatingDesc(a, b) { return (b.rating || 0) - (a.rating || 0); }

// "이번 주 추천 5곳"은 더 이상 다른 큐레이션 섹션들과 같은 가로 스크롤 행이 아니라,
// 홈 최상단의 큰 스와이프 히어로 캐러셀로 따로 렌더링됨 (renderHeroCarousel 참고).
function renderHeroCarousel() {
  const items = getWeeklyPicks(5);
  const container = document.getElementById('hero-carousel');
  if (!items.length) { container.innerHTML = ''; return; }
  const cardsHtml = items.map(food => `<div class="hero-card-wrap">${renderFoodCard(food, 'food-card-hero')}</div>`).join('');
  container.innerHTML = `
    <div class="hero-header">
      <div class="hero-title">이번 주 추천 5곳</div>
      <div class="hero-subtitle">매주 새롭게 골라드려요</div>
    </div>
    <div class="hero-scroll" id="hero-scroll">${cardsHtml}</div>
    <div class="hero-indicator" id="hero-indicator">1 / ${items.length}</div>`;
  const scroll = document.getElementById('hero-scroll');
  scroll.addEventListener('scroll', () => {
    const cardWidth = scroll.firstElementChild.getBoundingClientRect().width + 12; // gap 포함
    const idx = Math.round(scroll.scrollLeft / cardWidth);
    document.getElementById('hero-indicator').textContent = `${Math.min(idx + 1, items.length)} / ${items.length}`;
  });
}
document.getElementById('hero-carousel').addEventListener('click', e => {
  const saveBtn = e.target.closest('.card-save-btn');
  if (saveBtn) { toggleSaved(saveBtn.dataset.id); return; }
  const card = e.target.closest('.food-card');
  if (!card) return;
  const food = CURATED_FOOD.find(f => f.id === card.dataset.id);
  if (food && food.marker) select(food, food.marker);
});

    id: 'multi-youtuber',

    getSubtitle: items => `${items.length}곳이 동시에 추천받았어요`,
    getItems: () => CURATED_FOOD.filter(f => f.youtubers.length >= 2).sort(byRatingDesc),
  },
  {
    id: 'jeju',
    title: '제주 여행 가면 꼭 가볼 곳',
    getSubtitle: null,
    getItems: () => CURATED_FOOD.filter(f => f.address && f.address.includes('제주')).sort(byRatingDesc).slice(0, 8),
    moreFilter: () => { filterState.youtuber = ''; filterState.region = '제주'; filterState.categoryMajor = ''; filterState.certification = ''; },
  },
  {
    id: 'honbap-nopo',
    title: '혼밥하기 좋은 노포',
    getSubtitle: null,
    getItems: () => CURATED_FOOD.filter(f => f.certification && f.certification.includes('백년가게')).sort(byRatingDesc).slice(0, 8),
    moreFilter: () => {

      filterState.youtuber = ''; filterState.region = ''; filterState.categoryMajor = '';
      filterState.certification = opt ? opt.value : '';
    },
  },
  {
    id: 'unvisited-popular',

    getSubtitle: null,
    // 방문 기록이 하나도 없으면(처음 쓰는 사람) 의미가 없으니 빈 배열을 반환해 섹션 자체를 숨김
    getItems: () => {
      if (visitedSet.size === 0) return [];
      return CURATED_FOOD
        .filter(f => !isVisited(f.id) && (f.youtubers.length >= 2 || (f.rating || 0) >= 4.5))
        .sort(byRatingDesc)
        .slice(0, 8);
    },
    moreFilter: () => {
      filterState.youtuber = ''; filterState.region = ''; filterState.categoryMajor = ''; filterState.certification = '';
      filterState.visited = 'unvisited';
    },
  },
];

function applySectionFilter(sectionId) {
  const section = CURATION_SECTIONS.find(s => s.id === sectionId);
  if (!section || !section.moreFilter) return;
  deselect();
  section.moreFilter();
  applyFilters();
  document.getElementById('list-view').scrollTop = 0;
}

function renderCurationSections() {
  const container = document.getElementById('curation-sections');
  container.innerHTML = CURATION_SECTIONS.map(section => {
    const items = section.getItems();
    if (!items.length) return '';
    const subtitle = section.getSubtitle ? section.getSubtitle(items) : '';
    const moreBtn = section.moreFilter
      ? `<button class="curation-more-btn" data-section="${section.id}">더보기</button>`
      : '';
    const cardsHtml = items.map(food => renderFoodCard(food, 'food-card-mini')).join('');
    return `
      <div class="curation-section">
        <div class="curation-header">
          <div>
            <div class="curation-title">${esc(section.title)}</div>
            ${subtitle ? `<div class="curation-subtitle">${esc(subtitle)}</div>` : ''}
          </div>
          ${moreBtn}
        </div>
        <div class="curation-scroll">${cardsHtml}</div>
      </div>`;
  }).join('');
}

document.getElementById('curation-sections').addEventListener('click', e => {

  if (food && food.marker) select(food, food.marker);
});

function fillPanel(prefix, food) {
  const headId = prefix === 'd' ? 'd-head' : 's-head';
  const bodyId = prefix === 'd' ? 'd-body' : 's-body';
  const isMulti = food.youtubers.length > 1;

  // 헤더: 이름(클릭 시 네이버 플레이스)·배지·주소·전화·평점
  let ytBadgeHtml = '';
  if (food.youtubers.length > 0) {
    ytBadgeHtml = isMulti
      ? `<span class="badge-multi">🌟 ${food.youtubers.length}명의 유튜버가 추천했어요</span>`
      : `<span class="badge-yt">▶ ${esc(food.youtubers[0].name)}</span>`;
  }
  const certBadgeHtml = food.certification ? `<span class="badge-cert" title="${esc(food.certification)}">🏛️ 공식 인증</span>` : '';
  let headHtml = `
    <div class="d-name${food.naverUrl ? ' clickable' : ''}"${food.naverUrl ? ` onclick="window.open('${esc(food.naverUrl)}', '_blank', 'noopener')" title="네이버 지도에서 보기"` : ''}>${esc(food.name)}</div>
    <div class="d-badges">
      <span class="badge-cat">${esc(food.category)}</span>
      ${ytBadgeHtml}
      ${certBadgeHtml}
    </div>
    <button class="visit-toggle-btn${isVisited(food.id) ? ' on' : ''}" data-id="${esc(food.id)}">${isVisited(food.id) ? '✓ 가봤어요' : '가봤어요'}</button>
    <button class="save-toggle-btn${isSaved(food.id) ? ' on' : ''}" data-id="${esc(food.id)}">${isSaved(food.id) ? '★ 가고싶어요' : '☆ 가고싶어요'}</button>
    <div class="info-row">
      <span class="info-icon">📍</span>
      <span class="info-text">${esc(food.address)}</span>
    </div>`;
  if (food.phone) {
    headHtml += `
    <div class="info-row">
      <span class="info-icon">📞</span>
      <a href="tel:${esc(food.phone)}" class="info-text">${esc(food.phone)}</a>
    </div>`;
  }
  if (food.rating) {
    headHtml += `
    <div class="info-row" style="margin-top:4px;">
      <span class="info-icon">⭐</span>
      <div class="rating-row">
        <span class="rating-num">${food.rating}</span>
        ${food.reviewCount ? `<span class="rating-count">(리뷰 ${food.reviewCount.toLocaleString()}개)</span>` : ''}
      </div>
    </div>`;
  }
  document.getElementById(headId).innerHTML = headHtml;

  // 본문: 유튜버별 카드(채널·영상·추천이유)를 순서대로 나열
  let bodyHtml = food.youtubers.map(yt => `
    <div class="yt-section">
      <div class="yt-channel-row">
        <span style="font-size:20px;line-height:1;">▶️</span>
        <div class="yt-channel-info">
          <div class="yt-channel-label">추천 채널</div>
          <div class="yt-channel-name">${esc(yt.name)}</div>
        </div>
      </div>
      ${yt.videoUrl ? `
      <a class="yt-video-link" href="${esc(yt.videoUrl)}" target="_blank" rel="noopener">
        <span class="yt-play-icon">▶</span>
        <span class="yt-video-title">${esc(yt.videoTitle || '영상 보러가기')}</span>
      </a>` : ''}
      ${yt.recommendNote ? `
      <div class="note-section" style="margin-top:8px;">
        <div class="note-label">추천 이유</div>
        ${esc(yt.recommendNote)}
      </div>` : ''}
    </div>`).join('');

  // 유튜버 추천이 아니라 정부/공공기관 공식 인증(예: 백년가게)으로 등재된 경우
  if (food.certification) {
    bodyHtml += `
    <div class="cert-section">
      <div class="cert-row">
        <span style="font-size:20px;line-height:1;">🏅</span>
        <div class="cert-label">${esc(food.certification)}</div>
      </div>
      ${food.recommendNote ? `
      <div class="note-section" style="margin-top:8px;">
        <div class="note-label">소개</div>
        ${esc(food.recommendNote)}
      </div>` : ''}
    </div>`;
  }

  bodyHtml += `
    <div class="nav-section">
      <div class="nav-label">길찾기</div>
      <div class="nav-btns">
        <button class="nav-btn nav-kakao" onclick="navTo('kakao')">🟡 카카오</button>
        <button class="nav-btn nav-tmap" onclick="navTo('tmap')">🔴 티맵</button>
        <button class="nav-btn nav-naver" onclick="navTo('naver')">🟢 네이버</button>
      </div>
    </div>`;

  if (food.kakaoUrl) {
    bodyHtml += `<a class="kakao-place-link" href="${esc(food.kakaoUrl)}" target="_blank" rel="noopener">🗺️ 카카오맵에서 보기</a>`;
  }

  document.getElementById(bodyId).innerHTML = bodyHtml;
}

['d-head', 's-head'].forEach(headId => {
  document.getElementById(headId).addEventListener('click', e => {
    const visitBtn = e.target.closest('.visit-toggle-btn');
    if (visitBtn) { toggleVisited(visitBtn.dataset.id); return; }
    const saveBtn = e.target.closest('.save-toggle-btn');
    if (saveBtn) { toggleSaved(saveBtn.dataset.id); return; }
  });
});

function navTo(app) {
  if (!activeFood) return;
  openNavApp(app, activeFood.name, activeFood.lat, activeFood.lng);
}

/* ── 네비게이션 앱 연결 (골프노노 동일 패턴) ── */
function openNavApp(app, name, lat, lng) {
  const nameEnc = encodeURIComponent(name);
  let appUrl, fallback;
  if (app === 'kakao') {
    appUrl = `kakaomap://route?ep=${lat},${lng}&by=CAR`;
    fallback = `https://map.kakao.com/link/to/${nameEnc},${lat},${lng}`;
  } else if (app === 'tmap') {
    appUrl = `tmap://route?goalname=${nameEnc}&goalx=${lng}&goaly=${lat}`;
    fallback = 'https://tmap.life/';
  } else {
    appUrl = `nmap://route/car?dlat=${lat}&dlng=${lng}&dname=${nameEnc}&appname=foodmap`;
    fallback = `https://map.naver.com/p/search/${nameEnc}`;
  }
  window.location.href = appUrl;
  setTimeout(() => { window.open(fallback, '_blank'); }, 1500);
}

function goHome() {
  if (activeMarker) { activeMarker.setImage(activeMarker.normalImg); activeMarker = null; }
  activeFood = null;
  map.setCenter(new kakao.maps.LatLng(36.2, 127.8));
  map.setLevel(13);
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'flex';
  document.getElementById('map-wrap').classList.remove('mobile-visible');
  document.getElementById('map-fab').style.display = '';
  document.getElementById('list-view').scrollTop = 0;
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('home-fab').classList.remove('visible');
  document.querySelectorAll('.locate-btn').forEach(b => b.style.display = 'flex');
  if (activeMarker) { activeMarker.setImage(activeMarker.normalImg); activeMarker = null; }
  activeFood = null;
}

function locateMe() {
  if (!navigator.geolocation) { alert('위치 정보를 지원하지 않는 브라우저입니다.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      map.setCenter(new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
      map.setLevel(5);
    },
    () => { alert('위치 정보를 가져올 수 없습니다.'); }
  );
}

/* ── 검색 ── */
const searchInput = document.getElementById('search-input');
const searchDropdown = document.getElementById('search-dropdown');

searchInput.addEventListener('input', function() {
  const q = this.value.trim();
  if (!q) { searchDropdown.classList.remove('open'); return; }

  const results = CURATED_FOOD
    .filter(f => matchesFilters(f))
    .filter(f => f.name.includes(q) || f.address.includes(q) || f.category.includes(q))
    .slice(0, 5);

  if (!results.length) {
    searchDropdown.innerHTML = '<div class="search-empty">검색 결과가 없습니다</div>';
  } else {
    searchDropdown.innerHTML = results.map(f =>
      `<div class="search-item" data-id="${esc(f.id)}">
        <div class="search-item-name">${esc(f.name)}${f.youtubers.length > 1 ? ' <span style="color:#f59e0b;">🌟' + f.youtubers.length + '</span>' : ''}</div>
        <div class="search-item-sub">${esc(f.category)} · ${esc(f.address.split(' ').slice(0,3).join(' '))}</div>
      </div>`
    ).join('');
    searchDropdown.querySelectorAll('.search-item').forEach(el => {
      el.addEventListener('click', () => selectFromSearch(el.dataset.id));
    });
  }
  searchDropdown.classList.add('open');
});

searchInput.addEventListener('blur', () => {
  setTimeout(() => searchDropdown.classList.remove('open'), 200);
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchDropdown.classList.remove('open');
});

function selectFromSearch(id) {
  const food = CURATED_FOOD.find(f => f.id === id);
  if (!food || !food.marker) return;
  searchInput.value = '';
  searchDropdown.classList.remove('open');
  select(food, food.marker);
}

/* ── 바텀시트 스와이프 닫기 ── */
(function() {
  const sheet = document.getElementById('sheet');
  const handle = sheet.querySelector('.sheet-handle');
  let startY = 0;
  handle.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  handle.addEventListener('touchmove', e => {
    if (e.touches[0].clientY - startY > 80) closeSheet();
  }, { passive: true });
})();
</script>
