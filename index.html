<!-- 카카오맵 도메인: https://foodmap-kr.vercel.app -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodMap - 유튜버 추천 맛집 지도</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=28bac2696bc8d416ce3d2f349581838e&libraries=clusterer"></script>
<script src="data/curated-food.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow: hidden; scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #f4f6f8; color: #1a1a1a;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* 헤더 */
header {
  height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb;
  display: flex; align-items: center; padding: 0 16px; gap: 10px;
  flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  position: sticky; top: 0; z-index: 100;
}
.logo-wrap { cursor: pointer; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.logo-wrap:hover .logo-text { color: #22c55e; }
.logo-icon { font-size: 22px; }
.logo-text { font-size: 17px; font-weight: 700; color: #1a1a1a; transition: color .2s; }
.logo-sub { font-size: 10px; color: #9ca3af; }
.count-badge {
  background: #f0fdf4; color: #16a34a;
  border: 1px solid #bbf7d0; border-radius: 99px;
  padding: 3px 10px; font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.search-wrap { margin-left: auto; position: relative; flex-shrink: 0; }
.search-input-row {
  display: flex; align-items: center;
  background: #f4f6f8; border: 1.5px solid #e5e7eb;
  border-radius: 10px; padding: 0 10px; gap: 6px; transition: border-color .2s;
}
.search-input-row:focus-within { border-color: #22c55e; background: #fff; }
.search-icon { font-size: 13px; color: #9ca3af; flex-shrink: 0; }
.search-input {
  border: none; background: transparent; outline: none;
  font-size: 14px; font-family: inherit; color: #1a1a1a;
  width: 180px; height: 32px;
}
.search-input::placeholder { color: #9ca3af; }
.search-dropdown {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: #fff; border: 1.5px solid #e5e7eb; border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.10); z-index: 9999; overflow: hidden;
}
.search-dropdown.open { display: block; }
.search-item {
  padding: 10px 14px; cursor: pointer;
  border-bottom: 1px solid #f3f4f6; transition: background .15s;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: #f0fdf4; }
.search-item-name { font-size: 13px; font-weight: 700; color: #1a1a1a; }
.search-item-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.search-empty { padding: 14px; text-align: center; font-size: 13px; color: #9ca3af; }

/* 필터 바 (골프노노/와일드피크스 스타일 — 드롭다운 셀렉트 3개 상시 노출) */
#filter-bar {
  background: #fff; border-bottom: 1px solid #e5e7eb;
  padding: 8px 16px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.filter-select {
  padding: 7px 26px 7px 10px; border-radius: 8px;
  border: 1.5px solid #e5e7eb; background: #fff; color: #374151;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: border-color .15s; max-width: 170px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7280' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 10px center;
  -webkit-appearance: none; appearance: none;
}
.filter-select:hover { border-color: #86efac; }
.filter-select:focus { outline: none; border-color: #22c55e; }
.result-count-text { font-size: 12px; color: #6b7280; margin-left: auto; white-space: nowrap; }

@media (max-width: 767px) {
  #filter-bar { flex-wrap: wrap; }
  .filter-select { flex: 1 1 auto; min-width: 100px; max-width: none; }
  .result-count-text { display: none; }
}

/* ════════════════════════════════════════════════════════════════
   [OLD] 칩(chip) 기반 필터 패널 스타일 — 드롭다운 방식으로 교체되어
   더 이상 사용하지 않음. 나중에 되돌릴 수도 있어 삭제하지 않고
   주석 처리만 해 둠 (관련 HTML/JS도 동일하게 주석 처리됨).
#filter-trigger {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 99px;
  border: 1.5px solid #e5e7eb; background: #fff; color: #374151;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s; flex-shrink: 0;
}
#filter-trigger:hover { border-color: #22c55e; color: #16a34a; }
#filter-trigger.active { background: #f0fdf4; border-color: #22c55e; color: #16a34a; }
.filter-trigger-icon { font-size: 13px; }
.filter-trigger-badge {
  background: #16a34a; color: #fff; border-radius: 99px;
  min-width: 18px; height: 18px; padding: 0 5px;
  font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

#filter-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.32);
  z-index: 1400;
}
#filter-overlay.open { display: block; }

#filter-panel {
  display: none; position: fixed; top: 100px; left: 16px;
  width: 360px; max-height: 70vh;
  background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.18);
  z-index: 1500; flex-direction: column; overflow: hidden;
}
#filter-panel.open { display: flex; }
.filter-panel-handle { display: none; }
.filter-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0;
}
.filter-panel-title { font-size: 15px; font-weight: 700; color: #1a1a1a; }
.filter-panel-close {
  background: #f3f4f6; border: none; border-radius: 50%;
  width: 28px; height: 28px; font-size: 13px; color: #6b7280; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.filter-panel-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }
.filter-section-title { font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 8px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-group-sub { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e7eb; }
.filter-chip {
  padding: 6px 13px; border-radius: 99px;
  border: 1.5px solid #e5e7eb; background: #fff; color: #4b5563;
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s; white-space: nowrap;
}
.filter-chip:hover:not(.on) { border-color: #86efac; color: #16a34a; }
.filter-chip.on { background: #16a34a; border-color: #16a34a; color: #fff; }
.filter-chip.major.on { background: #15803d; border-color: #15803d; }
.filter-chip .chip-count { opacity: .65; font-weight: 500; margin-left: 3px; }
.filter-panel-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-top: 1px solid #f3f4f6; flex-shrink: 0;
}
.filter-reset-link {
  font-size: 13px; color: #6b7280; font-weight: 600; cursor: pointer;
  text-decoration: underline; flex-shrink: 0;
}
.filter-reset-link:hover { color: #ef4444; }
.filter-apply-btn {
  flex: 1; padding: 11px; border: none; border-radius: 10px;
  background: #16a34a; color: #fff; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: background .15s;
}
.filter-apply-btn:hover { background: #15803d; }

@media (max-width: 767px) {
  #filter-panel {
    top: auto; bottom: 0; left: 0; right: 0; width: 100%;
    border-radius: 20px 20px 0 0; max-height: 78vh;
  }
  .filter-panel-handle {
    display: block; width: 44px; height: 5px; background: #d1d5db;
    border-radius: 3px; margin: 10px auto 0; flex-shrink: 0;
  }
}
   ════════════════════════════════════════════════════════════════ */

/* 메인 */
.main { display: flex; flex: 1; overflow: hidden; }

/* 사이드바 */
#sidebar {
  width: 340px; min-width: 340px; background: #fff;
  border-right: 1px solid #e5e7eb;
  overflow-y: auto; overscroll-behavior: contain;
  box-shadow: 2px 0 8px rgba(0,0,0,.04);
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

/* 지도 */
.map-wrap { flex: 1; position: relative; }
#map { width: 100%; height: 100%; }
.locate-btn {
  position: fixed; bottom: 90px; right: 16px; z-index: 1100;
  width: 44px; height: 44px; border-radius: 50%;
  background: #fff; border: none; cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: box-shadow .2s, transform .15s;
}
.locate-btn:hover { box-shadow: 0 4px 16px rgba(34,197,94,.28); transform: scale(1.07); }
.locate-btn:active { transform: scale(.95); }

/* 웰컴 */
#welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; padding: 32px 24px;
  text-align: center; gap: 10px;
}
#welcome .ico { font-size: 52px; }
#welcome h2 { font-size: 16px; font-weight: 700; color: #1a1a1a; }
#welcome p { font-size: 13px; color: #6b7280; line-height: 1.75; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 6px; }
.chip {
  background: #f0fdf4; color: #16a34a;
  border: 1px solid #bbf7d0; border-radius: 99px;
  padding: 4px 12px; font-size: 11px; font-weight: 600;
}

/* 상세 패널 */
#detail { display: none; flex-direction: column; }

/* 헤더 영역 */
.d-head { padding: 16px; border-bottom: 1px solid #f3f4f6; }
.d-name { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
.d-name.clickable { cursor: pointer; display: inline-block; color: #2563eb; text-decoration: underline; transition: color .15s; }
.d-name.clickable:hover { color: #1e40af; }
.d-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.badge-cat {
  background: #f0fdf4; color: #16a34a;
  border: 1px solid #bbf7d0; border-radius: 99px;
  padding: 3px 10px; font-size: 11px; font-weight: 600;
}
.badge-yt {
  background: #fff1f2; color: #e11d48;
  border: 1px solid #fecdd3; border-radius: 99px;
  padding: 3px 10px; font-size: 11px; font-weight: 600;
}
.badge-multi {
  background: #fffbeb; color: #b45309;
  border: 1px solid #fde68a; border-radius: 99px;
  padding: 3px 10px; font-size: 11px; font-weight: 700;
}
.info-row {
  display: flex; align-items: flex-start; gap: 7px;
  font-size: 13px; color: #374151; margin-bottom: 5px;
}
.info-row:last-child { margin-bottom: 0; }
.info-icon { font-size: 14px; flex-shrink: 0; line-height: 1.5; }
.info-text { flex: 1; line-height: 1.5; }
a.info-text { color: #374151; text-decoration: none; }
a.info-text:hover { color: #22c55e; }
.rating-row { display: flex; align-items: center; gap: 5px; font-size: 13px; }
.rating-num { font-weight: 700; color: #1a1a1a; }
.rating-count { color: #9ca3af; font-size: 12px; }

/* 본문 */
.d-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

/* 유튜브 섹션 */
.yt-section {
  background: #fff5f5; border: 1px solid #fecdd3;
  border-radius: 12px; padding: 12px 14px;
}
.yt-channel-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.yt-channel-info { display: flex; flex-direction: column; gap: 1px; }
.yt-channel-label { font-size: 10px; color: #9ca3af; font-weight: 500; }
.yt-channel-name { font-size: 13px; font-weight: 700; color: #e11d48; }
.yt-video-link {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: #fff;
  border-radius: 8px; border: 1px solid #fecdd3;
  text-decoration: none; color: #1a1a1a;
  font-size: 13px; font-weight: 600; transition: background .15s;
}
.yt-video-link:hover { background: #fff1f2; }
.yt-play-icon { color: #e11d48; font-size: 15px; flex-shrink: 0; }
.yt-video-title { flex: 1; }

/* 추천 이유 */
.note-section {
  background: #f9fafb; border-left: 3px solid #22c55e;
  border-radius: 0 8px 8px 0; padding: 10px 12px;
  font-size: 12px; color: #4b5563; line-height: 1.7;
}
.note-label { font-size: 10px; font-weight: 700; color: #16a34a; margin-bottom: 4px; }

/* 길찾기 */
.nav-section { display: flex; flex-direction: column; gap: 7px; }
.nav-label { font-size: 11px; font-weight: 600; color: #9ca3af; }
.nav-btns { display: flex; gap: 6px; }
.nav-btn {
  flex: 1; padding: 9px 4px; border: none; border-radius: 8px;
  cursor: pointer; font-size: 11px; font-weight: 700; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 3px;
  transition: opacity .2s;
}
.nav-btn:hover { opacity: .85; }
.nav-btn:active { transform: scale(.97); }
.nav-kakao { background: #fee500; color: #3a1a1a; }
.nav-tmap { background: #ef4444; color: #fff; }
.nav-naver { background: #03c75a; color: #fff; }
.kakao-place-link {
  display: block; text-align: center; padding: 9px;
  border: 1.5px solid #e5e7eb; border-radius: 8px;
  font-size: 12px; font-weight: 600; color: #374151; text-decoration: none;
  transition: border-color .15s, background .15s, color .15s;
}
.kakao-place-link:hover { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }

/* 모바일 */
@media (max-width: 767px) {
  #sidebar { display: none; }
  #map { width: 100%; }
  .locate-btn { position: fixed !important; bottom: 90px !important; right: 16px !important; z-index: 1100 !important; }
  .count-badge { display: none; }
  .search-input { width: 130px; }

  #sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    z-index: 1000; height: 80vh; max-height: 80vh; overflow: hidden;
    box-shadow: 0 -4px 24px rgba(0,0,0,.12);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }
  #sheet.open { transform: translateY(0); }
  #sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .sheet-handle {
    width: 44px; height: 5px; background: #d1d5db;
    border-radius: 3px; margin: 12px auto 4px; cursor: grab; flex-shrink: 0;
  }
}
@media (min-width: 768px) { #sheet { display: none !important; } }

/* 홈 FAB */
#home-fab {
  display: none; position: fixed; bottom: 24px; left: 16px; z-index: 300;
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, #16a34a, #22c55e); border: none;
  box-shadow: 0 4px 16px rgba(22,163,74,.5), 0 2px 8px rgba(0,0,0,.2);
  cursor: pointer; align-items: center; justify-content: center;
}
#home-fab.visible { display: flex; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap" onclick="goHome()">
    <span class="logo-icon">🍽️</span>
    <div>
      <div class="logo-text">FoodMap</div>
      <div class="logo-sub">유튜버 추천 맛집</div>
    </div>
  </div>
  <span class="count-badge" id="cnt">0곳</span>
  <div class="search-wrap">
    <div class="search-input-row">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="text" placeholder="식당명·지역 검색..." autocomplete="off">
    </div>
    <div class="search-dropdown" id="search-dropdown"></div>
  </div>
</header>

<div id="filter-bar">
  <select id="filter-youtuber" class="filter-select" onchange="onFilterSelectChange()"></select>
  <select id="filter-region" class="filter-select" onchange="onFilterSelectChange()"></select>
  <select id="filter-category" class="filter-select" onchange="onFilterSelectChange()"></select>
  <span class="result-count-text" id="result-count-text"></span>
</div>

<!-- ════════════════════════════════════════════════════════════════
     [OLD] 칩 기반 필터 패널 (PC: 드롭다운 패널 / 모바일: 바텀시트) —
     드롭다운 셀렉트 방식으로 교체되어 더 이상 사용하지 않음.
     나중에 되돌릴 수도 있어 삭제하지 않고 주석 처리만 해 둠.
<div id="filter-overlay" onclick="closeFilterPanel()"></div>
<div id="filter-panel">
  <div class="filter-panel-handle" id="filter-panel-handle"></div>
  <div class="filter-panel-head">
    <span class="filter-panel-title">필터</span>
    <button class="filter-panel-close" onclick="closeFilterPanel()">✕</button>
  </div>
  <div class="filter-panel-body" id="filter-panel-body">
    <div class="filter-section">
      <div class="filter-section-title">🎬 유튜버</div>
      <div class="chip-group" id="filter-chips-youtuber"></div>
    </div>
    <div class="filter-section">
      <div class="filter-section-title">📍 지역</div>
      <div class="chip-group" id="filter-chips-region"></div>
    </div>
    <div class="filter-section">
      <div class="filter-section-title">🍽️ 음식종류</div>
      <div class="chip-group" id="filter-chips-category-major"></div>
      <div class="chip-group chip-group-sub" id="filter-chips-category-leaf"></div>
    </div>
  </div>
  <div class="filter-panel-footer">
    <a class="filter-reset-link" onclick="resetFilters()">초기화</a>
    <button class="filter-apply-btn" id="filter-apply-btn" onclick="applyFilterPanel()">결과 575곳 보기</button>
  </div>
</div>
     ════════════════════════════════════════════════════════════════ -->

<div class="main">
  <div id="sidebar">
    <div id="welcome">
      <div class="ico">🍜</div>
      <h2>유튜버 추천 맛집을 클릭하세요</h2>
      <p>지도의 녹색 마커를 클릭하면<br>맛집 정보와 유튜브 영상을<br>바로 확인할 수 있어요.</p>
      <div class="chips">
        <span class="chip">🎬 유튜버 추천</span>
        <span class="chip">📍 전국 맛집</span>
        <span class="chip">🗺️ 길찾기</span>
      </div>
    </div>

    <div id="detail">
      <div class="d-head" id="d-head"></div>
      <div class="d-body" id="d-body"></div>
    </div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <button class="locate-btn" onclick="locateMe()" title="내 위치">📍</button>
  </div>
</div>

<!-- 모바일 바텀시트 -->
<div id="sheet">
  <div class="sheet-handle"></div>
  <button onclick="closeSheet()" style="position:absolute;top:10px;right:14px;background:#f3f4f6;border:none;border-radius:50%;width:30px;height:30px;font-size:15px;color:#6b7280;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
  <div id="sheet-body">
    <div class="d-head" style="padding-top:8px;" id="s-head"></div>
    <div class="d-body" id="s-body"></div>
  </div>
</div>

<!-- 모바일 홈 FAB -->
<button id="home-fab" onclick="closeSheet(); setTimeout(goHome, 50);">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
</button>

<script>
// 지도 초기화
var container = document.getElementById('map');
var options = { center: new kakao.maps.LatLng(36.2, 127.8), level: 13 };
var map = new kakao.maps.Map(container, options);

const multiImg       = new kakao.maps.MarkerImage(mkStarSvg('#f59e0b', 24), new kakao.maps.Size(24,24), { offset: new kakao.maps.Point(12,12) });

let activeMarker = null;
let activeFood   = null;

/* ── 지역/카테고리 정규화 ── */
// 일부 주소가 "전남광주통합특별시"로 잘못 붙어 있어(카카오 API 응답 이슈),
// 광주광역시 5개 구는 광주로, 나머지 시/군은 전남으로 재분류한다.
const GWANGJU_GU = ['동구','서구','남구','북구','광산구'];
const REGION_ALIAS = {
  '전북특별자치도': '전북', '강원특별자치도': '강원', '제주특별자치도': '제주',
};
function extractRegion(address) {
  if (!address) return '기타';
  const [first, second] = address.split(' ');
  if (first === '전남광주통합특별시') return GWANGJU_GU.includes(second) ? '광주' : '전남';
  return REGION_ALIAS[first] || first;
}

  '토스트':'분식', '이삭토스트':'분식', '샌드위치':'분식', '오뎅바':'분식',
  '간식':'분식', '두찜':'분식', '한솥도시락':'분식', 'CU':'분식', '세븐일레븐':'분식',
  // 카페·디저트
  '아이스크림':'카페·디저트', '떡,한과':'카페·디저트', '커피전문점':'카페·디저트',
  '요거트월드':'카페·디저트', '이디야커피':'카페·디저트', '디저트카페':'카페·디저트',
  '파리바게뜨':'카페·디저트', '청년다방':'카페·디저트',
};
function getMajorCategory(cat) { return CATEGORY_MAJOR_MAP[cat] || '기타'; }

// 필터 상태 (3축: 유튜버/지역/음식종류 — 드롭다운 단일선택, 축 간 AND)
const filterState = {
  youtuber: '',
  region: '',
  categoryMajor: '',
};

function matchesFilters(food, state) {
  const s = state || filterState;
  if (s.youtuber && !food.youtubers.some(y => y.name === s.youtuber)) return false;
  if (s.region && extractRegion(food.address) !== s.region) return false;
  if (s.categoryMajor && getMajorCategory(food.category) !== s.categoryMajor) return false;
  return true;
}

/* ════════════════════════════════════════════════════════════════
   [OLD] 칩 기반 다중선택 필터 상태 — 드롭다운 단일선택 방식으로
   교체되어 더 이상 사용하지 않음. 나중에 되돌릴 수도 있어
   삭제하지 않고 주석 처리만 해 둠.
const filterState_OLD = {
  youtubers: new Set(),
  regions: new Set(),
  categoryMajors: new Set(),
  categoryLeaves: new Set(),
};
// 패널에서 "결과 보기"를 누르기 전까지의 임시(초안) 상태 — 취소 시 되돌릴 수 있도록 분리
let draftState = null;

function matchesFilters_OLD(food, state) {
  const s = state || filterState_OLD;
  if (s.youtubers.size > 0 && !food.youtubers.some(y => s.youtubers.has(y.name))) return false;
  if (s.regions.size > 0 && !s.regions.has(extractRegion(food.address))) return false;
  if (s.categoryMajors.size > 0 || s.categoryLeaves.size > 0) {
    const major = getMajorCategory(food.category);
    const majorMatch = s.categoryMajors.has(major);
    const leafMatch = s.categoryLeaves.has(food.category);
    if (!majorMatch && !leafMatch) return false;
  }
  return true;
}
   ════════════════════════════════════════════════════════════════ */

// 마커 클러스터러 (줌아웃 시 지역별로 숫자 뱃지로 뭉쳐 보임, 녹색 톤 통일)
const clusterer = new kakao.maps.MarkerClusterer({
  map,
  averageCenter: true,
  minLevel: 6,
  disableClickZoom: false,
  calculator: [15, 50],
  styles: [
    { // ~15개: 연한 녹색
      width: '32px', height: '32px', lineHeight: '32px',
      background: 'rgba(34,197,94,.88)', border: '3px solid #fff',
      borderRadius: '50%', color: '#fff', textAlign: 'center',
      fontSize: '12px', fontWeight: '700', boxShadow: '0 2px 8px rgba(22,163,74,.4)',
    },
    { // 15~50개: 중간 녹색
      width: '42px', height: '42px', lineHeight: '42px',
      background: 'rgba(22,163,74,.90)', border: '3px solid #fff',
      borderRadius: '50%', color: '#fff', textAlign: 'center',
      fontSize: '13px', fontWeight: '700', boxShadow: '0 2px 10px rgba(22,163,74,.45)',
    },
    { // 50개 초과: 진한 녹색
      width: '52px', height: '52px', lineHeight: '52px',
      background: 'rgba(21,128,61,.92)', border: '3px solid #fff',
      borderRadius: '50%', color: '#fff', textAlign: 'center',
      fontSize: '14px', fontWeight: '700', boxShadow: '0 2px 12px rgba(21,128,61,.5)',
    },
  ],
});

// 마커 생성 (복수 유튜버 추천 장소는 별 마커로 구분, map은 클러스터러가 관리)
CURATED_FOOD.forEach(food => {
  if (!food.lat || !food.lng) return;
  const isMulti = food.youtubers.length > 1;
  const nImg = isMulti ? multiImg : normalImg;
  const aImg = isMulti ? multiActiveImg : activeImg;
  const marker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(food.lat, food.lng),
    image: nImg,
    title: food.name,
  });
  marker.normalImg = nImg;
  marker.activeImg = aImg;
  food.marker = marker;
  kakao.maps.event.addListener(marker, 'click', () => select(food, marker));
});

clusterer.addMarkers(CURATED_FOOD.filter(f => f.marker).map(f => f.marker));

/* ── 필터 드롭다운 데이터 구성 (유튜버/지역/음식종류 목록 + 개수) ── */
const FILTER_YOUTUBER_OPTS = (() => {
  const counts = {};
  CURATED_FOOD.forEach(f => f.youtubers.forEach(y => { counts[y.name] = (counts[y.name]||0) + 1; }));
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
})();
const FILTER_REGION_OPTS = (() => {
  const counts = {};
  CURATED_FOOD.forEach(f => { const r = extractRegion(f.address); counts[r] = (counts[r]||0) + 1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
})();
const FILTER_CATEGORY_MAJOR_OPTS = (() => {
  const counts = {};
  CURATED_FOOD.forEach(f => { const m = getMajorCategory(f.category); counts[m] = (counts[m]||0) + 1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
})();

// 골프노노 스타일: <select> 옵션으로 렌더링, "전체" 옵션이 항상 첫 번째
function renderFilterSelect(selectId, allLabel, options, showCount) {
  const el = document.getElementById(selectId);
  el.innerHTML = `<option value="">${esc(allLabel)}</option>` +
    options.map(opt => `<option value="${esc(opt.value)}">${esc(opt.value)}${showCount ? ' ' + opt.count : ''}</option>`).join('');
}
renderFilterSelect('filter-youtuber', '유튜버 전체', FILTER_YOUTUBER_OPTS, true);
renderFilterSelect('filter-region', '지역 전체', FILTER_REGION_OPTS, false);
renderFilterSelect('filter-category', '음식종류 전체', FILTER_CATEGORY_MAJOR_OPTS, false);

function onFilterSelectChange() {
  filterState.youtuber = document.getElementById('filter-youtuber').value;
  filterState.region = document.getElementById('filter-region').value;
  filterState.categoryMajor = document.getElementById('filter-category').value;
  applyFilters();
}

function updateCount() {
  const n = CURATED_FOOD.filter(f => matchesFilters(f)).length;
  const activeCount = [filterState.youtuber, filterState.region, filterState.categoryMajor].filter(Boolean).length;
  document.getElementById('cnt').textContent = n + '곳';
  document.getElementById('result-count-text').textContent =
    activeCount > 0 ? `전체 ${CURATED_FOOD.length}곳 중 ${n}곳` : '';
}

/* ════════════════════════════════════════════════════════════════
   [OLD] 칩 기반 다중선택 필터 패널 렌더링 로직 — 드롭다운 방식으로
   교체되어 더 이상 사용하지 않음. 나중에 되돌릴 수도 있어
   삭제하지 않고 주석 처리만 해 둠.
const FILTER_CATEGORY_OPTS_OLD = (() => {
  const majorCounts = {};
  const leavesByMajor = {};
  CURATED_FOOD.forEach(f => {
    const major = getMajorCategory(f.category);
    majorCounts[major] = (majorCounts[major]||0) + 1;
    if (!leavesByMajor[major]) leavesByMajor[major] = {};
    leavesByMajor[major][f.category] = (leavesByMajor[major][f.category]||0) + 1;
  });
  const majors = Object.entries(majorCounts).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
  const leaves = {};
  Object.entries(leavesByMajor).forEach(([major, obj]) => {
    leaves[major] = Object.entries(obj).sort((a,b) => b[1]-a[1]).map(([name,count]) => ({ value: name, count }));
  });
  return { majors, leaves };
})();

function renderChipGroup(containerId, options, selectedSet, onToggle, extraClass) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = options.map(opt => `
    <button type="button" class="filter-chip${extraClass ? ' ' + extraClass : ''}${selectedSet.has(opt.value) ? ' on' : ''}" data-value="${esc(opt.value)}">
      ${esc(opt.value)}<span class="chip-count">${opt.count}</span>
    </button>`).join('');
  wrap.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => onToggle(btn.dataset.value, btn));
  });
}

function renderFilterPanel() {
  const s = draftState;
  renderChipGroup('filter-chips-youtuber', FILTER_YOUTUBER_OPTS, s.youtubers, (val, btn) => {
    toggleSetValue(s.youtubers, val);
    btn.classList.toggle('on');
    updateFilterPanelLiveCount();
  });
  renderChipGroup('filter-chips-region', FILTER_REGION_OPTS, s.regions, (val, btn) => {
    toggleSetValue(s.regions, val);
    btn.classList.toggle('on');
    updateFilterPanelLiveCount();
  });
  renderChipGroup('filter-chips-category-major', FILTER_CATEGORY_OPTS_OLD.majors, s.categoryMajors, (val, btn) => {
    toggleSetValue(s.categoryMajors, val);
    btn.classList.toggle('on');
    renderCategoryLeafChips();
    updateFilterPanelLiveCount();
  }, 'major');
  renderCategoryLeafChips();
  updateFilterPanelLiveCount();
}

function renderCategoryLeafChips() {
  const s = draftState;
  // 선택되었거나(펼쳐볼 필요 있는) 대분류의 세부 카테고리만 서브 칩으로 노출
  const majorsToShow = s.categoryMajors.size > 0 ? [...s.categoryMajors] : [];
  const leafOpts = majorsToShow.flatMap(m => FILTER_CATEGORY_OPTS_OLD.leaves[m] || []);
  renderChipGroup('filter-chips-category-leaf', leafOpts, s.categoryLeaves, (val, btn) => {
    toggleSetValue(s.categoryLeaves, val);
    btn.classList.toggle('on');
    updateFilterPanelLiveCount();
  });
  document.getElementById('filter-chips-category-leaf').style.display = leafOpts.length ? 'flex' : 'none';
}

function toggleSetValue(set, val) { set.has(val) ? set.delete(val) : set.add(val); }

function updateFilterPanelLiveCount() {
  const n = CURATED_FOOD.filter(f => matchesFilters_OLD(f, draftState)).length;
  document.getElementById('filter-apply-btn').textContent = `결과 ${n}곳 보기`;
}

function toggleFilterPanel() {
  const panel = document.getElementById('filter-panel');
  panel.classList.contains('open') ? closeFilterPanel() : openFilterPanel();
}

function openFilterPanel() {
  draftState = {
    youtubers: new Set(filterState_OLD.youtubers),
    regions: new Set(filterState_OLD.regions),
    categoryMajors: new Set(filterState_OLD.categoryMajors),
    categoryLeaves: new Set(filterState_OLD.categoryLeaves),
  };
  renderFilterPanel();
  document.getElementById('filter-panel').classList.add('open');
  document.getElementById('filter-overlay').classList.add('open');
}

function closeFilterPanel() {
  document.getElementById('filter-panel').classList.remove('open');
  document.getElementById('filter-overlay').classList.remove('open');
}

function resetFilters() {
  draftState = { youtubers: new Set(), regions: new Set(), categoryMajors: new Set(), categoryLeaves: new Set() };
  renderFilterPanel();
}

function applyFilterPanel() {
  filterState_OLD.youtubers = new Set(draftState.youtubers);
  filterState_OLD.regions = new Set(draftState.regions);
  filterState_OLD.categoryMajors = new Set(draftState.categoryMajors);
  filterState_OLD.categoryLeaves = new Set(draftState.categoryLeaves);
  closeFilterPanel();
  applyFilters();
}

function activeFilterChipCount() {
  return filterState_OLD.youtubers.size + filterState_OLD.regions.size + filterState_OLD.categoryMajors.size + filterState_OLD.categoryLeaves.size;
}
   ════════════════════════════════════════════════════════════════ */

function applyFilters() {
  const visibleMarkers = CURATED_FOOD.filter(f => f.marker && matchesFilters(f)).map(f => f.marker);
  clusterer.clear();
  clusterer.addMarkers(visibleMarkers);
  updateCount();
  if (activeFood && !matchesFilters(activeFood)) deselect();
}

updateCount();

function deselect() {
  if (activeMarker) { activeMarker.setImage(activeMarker.normalImg); activeMarker = null; }
  activeFood = null;
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('detail').style.display = 'none';
  closeSheet();
}

function select(food, marker) {
  if (activeMarker) activeMarker.setImage(activeMarker.normalImg);
  activeMarker = marker;
  marker.setImage(marker.activeImg);
  map.setCenter(new kakao.maps.LatLng(food.lat, food.lng));
  map.setLevel(4);
  activeFood = food;

  if (window.innerWidth < 768) {
    fillPanel('s', food);
    document.getElementById('sheet').classList.add('open');
    document.getElementById('home-fab').classList.add('visible');
    document.querySelectorAll('.locate-btn').forEach(b => b.style.display = 'none');
  } else {
    fillPanel('d', food);
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('detail').style.display = 'flex';
    document.getElementById('sidebar').scrollTop = 0;
  }
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fillPanel(prefix, food) {
  const headId = prefix === 'd' ? 'd-head' : 's-head';
  const bodyId = prefix === 'd' ? 'd-body' : 's-body';
  const isMulti = food.youtubers.length > 1;

  // 헤더: 이름(클릭 시 네이버 플레이스)·배지·주소·전화·평점
  let headHtml = `
    <div class="d-name${food.naverUrl ? ' clickable' : ''}"${food.naverUrl ? ` onclick="window.open('${esc(food.naverUrl)}', '_blank', 'noopener')" title="네이버 지도에서 보기"` : ''}>${esc(food.name)}</div>
    <div class="d-badges">
      <span class="badge-cat">${esc(food.category)}</span>
      ${isMulti
        ? `<span class="badge-multi">🌟 ${food.youtubers.length}명의 유튜버가 추천했어요</span>`
        : `<span class="badge-yt">▶ ${esc(food.youtubers[0].name)}</span>`}
    </div>
    <div class="info-row">
      <span class="info-icon">📍</span>
      <span class="info-text">${esc(food.address)}</span>
    </div>`;
  if (food.phone) {
    headHtml += `
    <div class="info-row">
      <span class="info-icon">📞</span>
      <a href="tel:${esc(food.phone)}" class="info-text">${esc(food.phone)}</a>
    </div>`;
  }
  if (food.rating) {
    headHtml += `
    <div class="info-row" style="margin-top:4px;">
      <span class="info-icon">⭐</span>
      <div class="rating-row">
        <span class="rating-num">${food.rating}</span>
        ${food.reviewCount ? `<span class="rating-count">(리뷰 ${food.reviewCount.toLocaleString()}개)</span>` : ''}
      </div>
    </div>`;
  }
  document.getElementById(headId).innerHTML = headHtml;

  // 본문: 유튜버별 카드(채널·영상·추천이유)를 순서대로 나열
  let bodyHtml = food.youtubers.map(yt => `
    <div class="yt-section">
      <div class="yt-channel-row">
        <span style="font-size:20px;line-height:1;">▶️</span>
        <div class="yt-channel-info">
          <div class="yt-channel-label">추천 채널</div>
          <div class="yt-channel-name">${esc(yt.name)}</div>
        </div>
      </div>
      ${yt.videoUrl ? `
      <a class="yt-video-link" href="${esc(yt.videoUrl)}" target="_blank" rel="noopener">
        <span class="yt-play-icon">▶</span>
        <span class="yt-video-title">${esc(yt.videoTitle || '영상 보러가기')}</span>
      </a>` : ''}
      ${yt.recommendNote ? `
      <div class="note-section" style="margin-top:8px;">
        <div class="note-label">추천 이유</div>
        ${esc(yt.recommendNote)}
      </div>` : ''}
    </div>`).join('');

  bodyHtml += `
    <div class="nav-section">
      <div class="nav-label">길찾기</div>
      <div class="nav-btns">
        <button class="nav-btn nav-kakao" onclick="navTo('kakao')">🟡 카카오</button>
        <button class="nav-btn nav-tmap" onclick="navTo('tmap')">🔴 티맵</button>
        <button class="nav-btn nav-naver" onclick="navTo('naver')">🟢 네이버</button>
      </div>
    </div>`;

  if (food.kakaoUrl) {
    bodyHtml += `<a class="kakao-place-link" href="${esc(food.kakaoUrl)}" target="_blank" rel="noopener">🗺️ 카카오맵에서 보기</a>`;
  }

  document.getElementById(bodyId).innerHTML = bodyHtml;
}

function navTo(app) {
  if (!activeFood) return;
  openNavApp(app, activeFood.name, activeFood.lat, activeFood.lng);
}

/* ── 네비게이션 앱 연결 (골프노노 동일 패턴) ── */
function openNavApp(app, name, lat, lng) {
  const nameEnc = encodeURIComponent(name);
  let appUrl, fallback;
  if (app === 'kakao') {
    appUrl = `kakaomap://route?ep=${lat},${lng}&by=CAR`;
    fallback = `https://map.kakao.com/link/to/${nameEnc},${lat},${lng}`;
  } else if (app === 'tmap') {
    appUrl = `tmap://route?goalname=${nameEnc}&goalx=${lng}&goaly=${lat}`;
    fallback = 'https://tmap.life/';
  } else {
    appUrl = `nmap://route/car?dlat=${lat}&dlng=${lng}&dname=${nameEnc}&appname=foodmap`;
    fallback = `https://map.naver.com/p/search/${nameEnc}`;
  }
  window.location.href = appUrl;
  setTimeout(() => { window.open(fallback, '_blank'); }, 1500);
}

function goHome() {
  if (activeMarker) { activeMarker.setImage(activeMarker.normalImg); activeMarker = null; }
  activeFood = null;
  map.setCenter(new kakao.maps.LatLng(36.2, 127.8));
  map.setLevel(13);
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('detail').style.display = 'none';
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('home-fab').classList.remove('visible');
  document.querySelectorAll('.locate-btn').forEach(b => b.style.display = 'flex');
  if (activeMarker) { activeMarker.setImage(activeMarker.normalImg); activeMarker = null; }
  activeFood = null;
}

function locateMe() {
  if (!navigator.geolocation) { alert('위치 정보를 지원하지 않는 브라우저입니다.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      map.setCenter(new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
      map.setLevel(5);
    },
    () => { alert('위치 정보를 가져올 수 없습니다.'); }
  );
}

/* ── 검색 ── */
const searchInput = document.getElementById('search-input');
const searchDropdown = document.getElementById('search-dropdown');

searchInput.addEventListener('input', function() {
  const q = this.value.trim();
  if (!q) { searchDropdown.classList.remove('open'); return; }

  const results = CURATED_FOOD
    .filter(f => matchesFilters(f))
    .filter(f => f.name.includes(q) || f.address.includes(q) || f.category.includes(q))
    .slice(0, 5);

  if (!results.length) {
    searchDropdown.innerHTML = '<div class="search-empty">검색 결과가 없습니다</div>';
  } else {
    searchDropdown.innerHTML = results.map(f =>
      `<div class="search-item" data-id="${esc(f.id)}">
        <div class="search-item-name">${esc(f.name)}${f.youtubers.length > 1 ? ' <span style="color:#f59e0b;">🌟' + f.youtubers.length + '</span>' : ''}</div>
        <div class="search-item-sub">${esc(f.category)} · ${esc(f.address.split(' ').slice(0,3).join(' '))}</div>
      </div>`
    ).join('');
    searchDropdown.querySelectorAll('.search-item').forEach(el => {
      el.addEventListener('click', () => selectFromSearch(el.dataset.id));
    });
  }
  searchDropdown.classList.add('open');
});

searchInput.addEventListener('blur', () => {
  setTimeout(() => searchDropdown.classList.remove('open'), 200);
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchDropdown.classList.remove('open');
});

function selectFromSearch(id) {
  const food = CURATED_FOOD.find(f => f.id === id);
  if (!food || !food.marker) return;
  searchInput.value = '';
  searchDropdown.classList.remove('open');
  select(food, food.marker);
}

/* ── 바텀시트 스와이프 닫기 ── */
(function() {
  const sheet = document.getElementById('sheet');
  const handle = sheet.querySelector('.sheet-handle');
  let startY = 0;
  handle.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  handle.addEventListener('touchmove', e => {
    if (e.touches[0].clientY - startY > 80) closeSheet();
  }, { passive: true });
})();
</script>
</body>
